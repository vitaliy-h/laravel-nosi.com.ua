name: Deploy

# FTP-only hosting: the code is uploaded over FTP, then POST /api/deploy runs
# migrate and the caches on the server.
#
# vendor/ and the published Filament assets are NOT uploaded — file-by-file FTP
# of vendor/ takes hours. They are uploaded by hand as an archive, once and again
# whenever composer.lock changes. Server setup and the secrets: docs/project/deploy.md.

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Full history so every file gets the time of the commit that last
      # changed it — `mirror --only-newer` below compares those times with the
      # server, so only files changed since the last upload go up.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore file times from git
        uses: chetan/git-restore-mtime-action@v2

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # Plain FTP, as the hosting's FTPS dropped the connection mid-upload.
      # lftp reconnects by itself when the hosting drops the connection, and a
      # rerun continues where the previous one stopped. Nothing is ever deleted
      # on the server: its .env, vendor/, logs and uploaded images stay.
      - name: Upload over FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          printf 'machine %s login %s password %s\n' "$FTP_SERVER" "$FTP_USERNAME" "$FTP_PASSWORD" > ~/.netrc
          chmod 600 ~/.netrc
          lftp -c "
            debug -t 2;
            set ftp:ssl-allow false;
            set ftp:passive-mode true;
            set net:timeout 20;
            set net:max-retries 10;
            set net:reconnect-interval-base 5;
            set net:reconnect-interval-max 30;
            set net:persist-retries 10;
            open ftp://$FTP_SERVER;
            mirror --reverse --only-newer --no-perms --parallel=3 --verbose=3 \
              -x '^\.git/' -x '^\.github/' -x '^node_modules/' -x '^vendor/' \
              -x '^public/(js|css|fonts)/filament/' \
              -x '^\.env$' -x '^\.osp/' -x '^\.claude/' \
              -x '^tests/' -x '^docs/' -x '^design/' \
              -x '^storage/logs/.*\.log$' \
              -x '^(phpunit\.xml|compose\.yaml|\.ftp-deploy-sync-state\.json)$' \
              ./ $FTP_SERVER_DIR
          "

      - name: Run migrations and caches
        run: |
          curl --fail-with-body -sS -X POST --max-time 600 \
            -H "X-Deploy-Token: ${{ secrets.DEPLOY_TOKEN }}" \
            -H "Accept: application/json" \
            "${{ secrets.DEPLOY_URL }}/api/deploy"
