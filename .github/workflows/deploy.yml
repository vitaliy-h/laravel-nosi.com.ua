name: Deploy

# FTP-only hosting: the code is uploaded over FTP, then POST /api/deploy runs
# migrate and the caches on the server.
#
# vendor/ and the published Filament assets are NOT uploaded — file-by-file FTP
# of vendor/ takes hours. They are uploaded by hand as an archive, once and again
# whenever composer.lock changes. Server setup and the secrets: docs/project/deploy.md.

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Only the changed files are uploaded: the action keeps its state file
      # (.ftp-deploy-sync-state.json) on the server. It never touches files it
      # did not upload itself — the server .env, vendor/, logs, uploaded images stay.
      - name: Upload over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          protocol: ftps
          security: loose
          exclude: |
            **/.git/**
            .github/**
            **/node_modules/**
            vendor/**
            public/js/filament/**
            public/css/filament/**
            public/fonts/filament/**
            .env
            .osp/**
            .claude/**
            tests/**
            docs/**
            design/**
            storage/logs/*.log
            phpunit.xml
            compose.yaml

      - name: Run migrations and caches
        run: |
          curl --fail-with-body -sS -X POST --max-time 600 \
            -H "X-Deploy-Token: ${{ secrets.DEPLOY_TOKEN }}" \
            -H "Accept: application/json" \
            "${{ secrets.DEPLOY_URL }}/api/deploy"
