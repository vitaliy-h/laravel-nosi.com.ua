version: '3'
services:
    #    PHP service
    web:
        container_name: "bigjol_web"
        build:
            context: ./docker/web
            args:
                HOST_UID: "${HOST_UID:-1000}"
        restart: unless-stopped
        ports:
            - '${PUSHER_PORT:-6001}:6001'
        volumes:
            - .:/var/www/html
        depends_on:
            - mysql
            - nginx
        networks:
            - app-network
    #   WEB server
    nginx:
        container_name: "bigjol_nginx"
        build:
            context: ./docker/nginx
            args:
                NGINX_ENV: "${APP_ENV:-local}"
        ports:
            - '${APP_PORT:-80}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        networks:
            - app-network
        volumes:
            - .:/var/www/html
        restart: unless-stopped
    # MYSQL server
    mysql:
        image: 'mysql/mysql-server:8.0'
        ports:
            - '${FORWARD_DB_PORT:-3336}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ROOT_HOST: "%"
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
        volumes:
            - 'appmysql:/var/lib/mysql'
        networks:
            - app-network
        healthcheck:
            test: [ "CMD", "mysqladmin", "ping", "-p${DB_PASSWORD}" ]
            retries: 3
            timeout: 5s

#Docker Networks
networks:
    app-network:
        driver: bridge
volumes:
    appmysql:
        driver: local
